<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vivid</title>
<style>
:root {
  --bg: #121417; --panel: #1b1e23; --panel2: #23272e; --line: #2f343c; --text: #e6e8eb; --muted: #9aa3ad;
  --accent: #f0a531; --accent-ink: #1b1300; --err: #ff6b6b; --ok: #6bd49a; --sel: #33404f;
  --mono: ui-monospace, "Roboto Mono", "Droid Sans Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f2ee; --panel: #ffffff; --panel2: #ebe8e2; --line: #d8d3ca; --text: #1d1f22; --muted: #6b6f75;
    --accent: #c27400; --accent-ink: #ffffff; --err: #c62828; --ok: #2e7d32; --sel: #ffe2b3;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; min-height: 38px; cursor: pointer; }
button:active { filter: brightness(1.25); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; }
button:disabled { opacity: .45; }
select, input[type=text] { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 8px; min-height: 38px; }
#app { display: flex; flex-direction: column; height: 100%; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .title { font-weight: 700; letter-spacing: .5px; }
header .title span { color: var(--accent); }
header .file { flex: 1; min-width: 0; color: var(--muted); font-family: var(--mono); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .file b { color: var(--text); font-weight: 600; }
.dirty::after { content: " ●"; color: var(--accent); }
nav { display: flex; background: var(--panel); border-bottom: 1px solid var(--line); }
nav button { flex: 1; border: 0; border-radius: 0; background: transparent; border-bottom: 2px solid transparent; color: var(--muted); min-height: 42px; }
nav button.on { color: var(--text); border-bottom-color: var(--accent); }
nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; margin-left: 4px; }
main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: none; flex-direction: column; }
.view.on { display: flex; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); align-items: center; }
.bar .grow { flex: 1; }
.scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; }
/* files */
.group { padding: 4px 0 8px; }
.group h3 { margin: 10px 12px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.frow { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line); min-height: 48px; }
.frow .nm { flex: 1; font-family: var(--mono); font-size: 14px; padding: 12px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .sz { color: var(--muted); font-size: 12px; }
.frow.cur { background: var(--sel); }
.empty { padding: 24px 16px; color: var(--muted); }
/* editor */
#ed { flex: 1; width: 100%; resize: none; border: 0; outline: none; padding: 10px 10px 40vh; margin: 0;
  background: var(--bg); color: var(--text); font: 13.5px/1.5 var(--mono); white-space: pre; overflow: auto; tab-size: 4; }
#edstat { padding: 4px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); display: flex; gap: 12px; }
/* image */
#imgwrap { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 10px; background: repeating-conic-gradient(var(--panel) 0 25%, var(--bg) 0 50%) 0 0/20px 20px; }
#cv { width: 100%; max-width: 1400px; height: auto; background: #000; box-shadow: 0 2px 12px rgba(0,0,0,.4); }
#cv.full { width: auto; max-width: none; }
#prog { height: 4px; background: var(--line); }
#prog div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
#imginfo { padding: 6px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); min-height: 28px; }
.opts { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; padding: 10px; align-items: center; background: var(--panel); border-bottom: 1px solid var(--line); }
.opts label { font-size: 13px; color: var(--muted); }
.opts .chk { grid-column: 1 / -1; display: flex; gap: 16px; flex-wrap: wrap; }
.opts .chk label { color: var(--text); display: flex; align-items: center; gap: 6px; }
details.optbox > summary { list-style: none; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
details.optbox > summary::before { content: "▸ "; }
details.optbox[open] > summary::before { content: "▾ "; }
/* log */
#log { padding: 8px 0; font: 13px/1.45 var(--mono); }
#log .ln { padding: 6px 12px; border-bottom: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
#log .err { color: var(--err); }
#log .ok { color: var(--ok); }
#log .warn { color: var(--accent); }
#log a { color: inherit; text-decoration: underline; }
/* modal */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
#modal.on { display: flex; }
#modal .box { background: var(--panel); width: 100%; max-width: 560px; max-height: 85%; overflow: auto; border-radius: 14px 14px 0 0; padding: 14px; }
#modal h2 { margin: 0 0 10px; font-size: 17px; }
#modal .msg { color: var(--muted); margin: 0 0 12px; white-space: pre-wrap; }
#modal .btns { display: flex; flex-direction: column; gap: 8px; }
#modal .btns button { width: 100%; text-align: left; }
#modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#modal input[type=text] { width: 100%; }
#help { font-size: 13.5px; }
#help code, #help pre { font-family: var(--mono); font-size: 12.5px; }
#help pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow: auto; }
#help h4 { margin: 14px 0 4px; color: var(--accent); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 20px; display: none; z-index: 20; max-width: 90%; text-align: center; font-size: 14px; }
#toast.on { display: block; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">VIVID<span>2</span></div>
    <div class="file" id="hfile">–</div>
    <button id="bSave" title="Mentés">Mentés</button>
    <button id="bRender" class="primary" title="Renderelés">▶</button>
  </header>
  <nav>
    <button data-v="files" class="on">Fájlok</button>
    <button data-v="edit">Szerkesztő</button>
    <button data-v="image">Kép</button>
    <button data-v="log">Napló<span id="logbadge"></span></button>
  </nav>
  <main>
    <section class="view on" id="v-files">
      <div class="bar">
        <button id="bNew">+ Új</button>
        <button id="bImport">Importálás (ZIP / fájl)</button>
        <span class="grow"></span>
        <button id="bMore" class="ghost">⋯</button>
      </div>
      <div class="scroll" id="flist"></div>
    </section>
    <section class="view" id="v-edit">
      <div class="bar">
        <button id="bGoto">Sor…</button>
        <button id="bFind">Keresés…</button>
        <button id="bHelp">Súgó</button>
        <span class="grow"></span>
        <button id="bFont" class="ghost">A±</button>
      </div>
      <textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
      <div id="edstat"><span id="pos">1:1</span><span id="edinfo"></span></div>
    </section>
    <section class="view" id="v-image">
      <div class="bar">
        <button id="bRender2" class="primary">▶ Render</button>
        <button id="bStop" disabled>■ Stop</button>
        <span class="grow"></span>
        <button id="bZoom" class="ghost">1:1</button>
        <button id="bPng">PNG mentése</button>
      </div>
      <details class="optbox" id="optbox">
        <summary>Render-beállítások</summary>
        <div class="opts">
          <label for="oRes">Felbontás</label>
          <select id="oRes">
            <option value="studio">a studio blokk szerint</option>
            <option value="160x100">160 × 100 (gyors előnézet)</option>
            <option value="320x200">320 × 200</option>
            <option value="640x400">640 × 400</option>
            <option value="800x500">800 × 500</option>
            <option value="1024x640">1024 × 640</option>
            <option value="1280x800">1280 × 800</option>
            <option value="1920x1200">1920 × 1200</option>
            <option value="640x480">640 × 480 (4:3)</option>
            <option value="1024x768">1024 × 768 (4:3)</option>
          </select>
          <label for="oAA">Élsimítás</label>
          <select id="oAA">
            <option value="studio">a studio blokk szerint</option>
            <option value="none">none</option>
            <option value="quick">quick</option>
            <option value="corners">corners</option>
            <option value="adaptive">adaptive</option>
          </select>
          <div class="chk">
            <label><input type="checkbox" id="oSquare" checked> négyzetes pixelek</label>
            <label><input type="checkbox" id="oNoShadow"> árnyékok ki</label>
          </div>
        </div>
      </details>
      <div id="prog"><div></div></div>
      <div id="imgwrap"><canvas id="cv" width="320" height="200"></canvas></div>
      <div id="imginfo">Még nincs renderelt kép.</div>
    </section>
    <section class="view" id="v-log">
      <div class="bar"><span class="grow" style="color:var(--muted);font-size:13px">Hibák és figyelmeztetések</span><button id="bClearLog" class="ghost">Törlés</button></div>
      <div class="scroll"><div id="log"></div></div>
    </section>
  </main>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" multiple style="display:none">

<script type="text/plain" id="renderer-src">/*__RENDERER__*/</script>
<script>var SAMPLES = /*__SAMPLES__*/{};</script>
<script>
'use strict';
// ------------------------------------------------------------------ storage
var LS_PREFIX = 'vivid:file:';
var store = (function () {
  var A = window.Android;
  if (A && A.listFiles) {
    return {
      list: function () { try { return JSON.parse(A.listFiles() || '[]'); } catch (e) { return []; } },
      read: function (n) { var s = A.readFile(n); return s == null ? null : String(s); },
      write: function (n, c) { return !!A.writeFile(n, c); },
      del: function (n) { return !!A.deleteFile(n); },
      native: true
    };
  }
  return {
    list: function () { var r = []; for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(LS_PREFIX) === 0) r.push(k.substr(LS_PREFIX.length)); } return r; },
    read: function (n) { return localStorage.getItem(LS_PREFIX + n); },
    write: function (n, c) { try { localStorage.setItem(LS_PREFIX + n, c); return true; } catch (e) { return false; } },
    del: function (n) { localStorage.removeItem(LS_PREFIX + n); return true; },
    native: false
  };
})();
function pref(k, v) {
  try { if (v === undefined) return localStorage.getItem('vivid:pref:' + k); localStorage.setItem('vivid:pref:' + k, v); } catch (e) { return null; }
}

// ------------------------------------------------------------------ helpers
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ext(n) { var m = /\.([^.]+)$/.exec(n); return m ? m[1].toLowerCase() : ''; }
function isScene(n) { return ext(n) === 'v'; }
var toastT;
function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, ms || 2500); }
function validName(n) { return /^[A-Za-z0-9_][A-Za-z0-9_.\-]{0,63}$/.test(n) && n.indexOf('..') < 0; }
function fmtSize(n) { return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB'; }

// ------------------------------------------------------------------ modal
var modalResolve = null;
function closeModal(v) { $('modal').classList.remove('on'); var r = modalResolve; modalResolve = null; if (r) r(v); }
function modal(html, setup) {
  return new Promise(function (res) {
    if (modalResolve) closeModal(null);
    modalResolve = res;
    $('mbox').innerHTML = html;
    $('modal').classList.add('on');
    if (setup) setup($('mbox'));
  });
}
$('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(null); });
function choose(title, items, msg) {
  return modal('<h2>' + esc(title) + '</h2>' + (msg ? '<p class="msg">' + esc(msg) + '</p>' : '') + '<div class="btns">' +
    items.map(function (it, i) { return '<button data-i="' + i + '"' + (it.primary ? ' class="primary"' : '') + '>' + esc(it.label) + '</button>'; }).join('') +
    '<button data-i="-1" class="ghost">Mégse</button></div>', function (box) {
      box.querySelectorAll('button[data-i]').forEach(function (b) {
        b.onclick = function () { var i = +b.getAttribute('data-i'); closeModal(i < 0 ? null : items[i].value); };
      });
    });
}
function ask(title, label, value) {
  return modal('<h2>' + esc(title) + '</h2><p class="msg">' + esc(label) + '</p><input type="text" id="mIn" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(value || '') +
    '"><div class="row"><button class="ghost" id="mNo">Mégse</button><button class="primary" id="mOk">OK</button></div>', function (box) {
      var inp = $('mIn'); setTimeout(function () { inp.focus(); inp.select(); }, 50);
      $('mOk').onclick = function () { closeModal(inp.value.trim()); };
      $('mNo').onclick = function () { closeModal(null); };
      inp.onkeydown = function (e) { if (e.key === 'Enter') closeModal(inp.value.trim()); };
    });
}
function confirmBox(title, msg, okLabel) {
  return choose(title, [{ label: okLabel || 'OK', value: true, primary: true }], msg).then(function (v) { return !!v; });
}

// ------------------------------------------------------------------ state
var cur = null;          // currently open file name
var curSaved = '';       // last saved content of the open file
var lastScene = pref('lastScene') || null;
var ed = $('ed');

function fileList() { return store.list().sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : 1; }); }
function isDirty() { return cur !== null && ed.value !== curSaved; }
function updateHeader() {
  var h = $('hfile');
  h.innerHTML = cur ? '<b>' + esc(cur) + '</b>' : '–';
  h.classList.toggle('dirty', isDirty());
  $('bSave').disabled = !cur;
}

// ------------------------------------------------------------------ views
var currentView = 'files';
function show(v) {
  currentView = v;
  document.querySelectorAll('nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
  document.querySelectorAll('.view').forEach(function (s) { s.classList.toggle('on', s.id === 'v-' + v); });
  if (v === 'files') renderFiles();
}
document.querySelectorAll('nav button').forEach(function (b) { b.onclick = function () { show(b.getAttribute('data-v')); }; });

// ------------------------------------------------------------------ file list
var GROUPS = [
  { title: 'Jelenetek (.v)', test: function (e) { return e === 'v'; } },
  { title: 'Include fájlok (.vo, .vc, .vs)', test: function (e) { return e === 'vo' || e === 'vc' || e === 'vs'; } },
  { title: 'Paletták (.map)', test: function (e) { return e === 'map'; } },
  { title: 'Egyéb / dokumentáció', test: function () { return true; } }
];
function renderFiles() {
  var names = fileList(), used = {}, html = '';
  if (!names.length) {
    $('flist').innerHTML = '<div class="empty">Nincsenek fájlok. Az „Importálás” gombbal betöltheted a vivid2.zip összes példáját, vagy a ⋯ menüben visszaállíthatod a beépített mintákat.</div>';
    return;
  }
  GROUPS.forEach(function (g) {
    var list = names.filter(function (n) { return !used[n] && g.test(ext(n)); });
    if (!list.length) return;
    list.forEach(function (n) { used[n] = 1; });
    html += '<div class="group"><h3>' + esc(g.title) + '</h3>' + list.map(function (n) {
      return '<div class="frow' + (n === cur ? ' cur' : '') + '" data-n="' + esc(n) + '"><div class="nm">' + esc(n) + '</div>' +
        (isScene(n) ? '<button class="ghost" data-act="render" title="Renderelés">▶</button>' : '') +
        '<button class="ghost" data-act="menu" title="Műveletek">⋯</button></div>';
    }).join('') + '</div>';
  });
  $('flist').innerHTML = html;
}
$('flist').addEventListener('click', function (e) {
  var row = e.target.closest('.frow'); if (!row) return;
  var n = row.getAttribute('data-n'), act = e.target.getAttribute('data-act');
  if (act === 'render') { openFile(n).then(function (ok) { if (ok) { show('image'); startRender(); } }); return; }
  if (act === 'menu') { fileMenu(n); return; }
  openFile(n).then(function (ok) { if (ok) show('edit'); });
});

function fileMenu(n) {
  var items = [{ label: 'Megnyitás', value: 'open' }];
  if (isScene(n)) items.push({ label: 'Renderelés', value: 'render' });
  items.push({ label: 'Átnevezés', value: 'rename' }, { label: 'Másolat készítése', value: 'copy' },
             { label: 'Exportálás a Letöltések mappába', value: 'export' }, { label: 'Törlés', value: 'delete' });
  var c = store.read(n);
  choose(n, items, c != null ? fmtSize(c.length) + ', ' + c.split('\n').length + ' sor' : '').then(function (a) {
    if (!a) return;
    if (a === 'open') openFile(n).then(function (ok) { if (ok) show('edit'); });
    else if (a === 'render') openFile(n).then(function (ok) { if (ok) { show('image'); startRender(); } });
    else if (a === 'rename') renameFile(n);
    else if (a === 'copy') copyFile(n);
    else if (a === 'export') exportText(n, n === cur ? ed.value : store.read(n));
    else if (a === 'delete') deleteFile(n);
  });
}

function guardUnsaved() {
  if (!isDirty()) return Promise.resolve(true);
  return choose('Nem mentett módosítás', [
    { label: 'Mentés', value: 'save', primary: true }, { label: 'Elvetés', value: 'discard' }
  ], cur + ' módosult. Mi legyen vele?').then(function (a) {
    if (a === 'save') return saveCurrent();
    if (a === 'discard') { ed.value = curSaved; updateHeader(); return true; }
    return false;
  });
}

function openFile(n, line) {
  if (n === cur) { if (line) gotoLine(line); return Promise.resolve(true); }
  return guardUnsaved().then(function (ok) {
    if (!ok) return false;
    var c = store.read(n);
    if (c == null) { toast('Nem olvasható: ' + n); return false; }
    cur = n; curSaved = c; ed.value = c;
    if (isScene(n)) { lastScene = n; pref('lastScene', n); }
    pref('lastOpen', n);
    ed.scrollTop = 0; ed.setSelectionRange(0, 0);
    updateHeader(); updatePos();
    if (line) setTimeout(function () { gotoLine(line); }, 30);
    return true;
  });
}
function saveCurrent() {
  if (!cur) return Promise.resolve(false);
  if (store.write(cur, ed.value)) { curSaved = ed.value; updateHeader(); toast('Mentve: ' + cur); return Promise.resolve(true); }
  toast('Mentési hiba!'); return Promise.resolve(false);
}
$('bSave').onclick = saveCurrent;

function newFile() {
  ask('Új fájl', 'Fájlnév (pl. jelenet.v, targy.vo)', 'uj.v').then(function (n) {
    if (!n) return;
    if (!validName(n)) { toast('Érvénytelen fájlnév'); return; }
    if (store.read(n) != null) { toast('Már létezik: ' + n); return; }
    var tpl = isScene(n) ? TEMPLATE : '// ' + n + '\n';
    store.write(n, tpl);
    openFile(n).then(function () { show('edit'); });
  });
}
$('bNew').onclick = newFile;
function renameFile(n) {
  ask('Átnevezés', 'Új név', n).then(function (nn) {
    if (!nn || nn === n) return;
    if (!validName(nn)) { toast('Érvénytelen fájlnév'); return; }
    if (store.read(nn) != null) { toast('Már létezik: ' + nn); return; }
    var c = n === cur ? ed.value : store.read(n);
    if (!store.write(nn, c)) { toast('Hiba'); return; }
    store.del(n);
    if (n === cur) { cur = nn; curSaved = c; updateHeader(); }
    if (lastScene === n) { lastScene = nn; pref('lastScene', nn); }
    renderFiles();
  });
}
function copyFile(n) {
  var base = n.replace(/(\.[^.]+)?$/, ''), e = /\.[^.]+$/.exec(n); e = e ? e[0] : '';
  var cand = base + '_masolat' + e, i = 2;
  while (store.read(cand) != null) cand = base + '_masolat' + (i++) + e;
  ask('Másolat', 'A másolat neve', cand).then(function (nn) {
    if (!nn) return;
    if (!validName(nn) || store.read(nn) != null) { toast('Érvénytelen vagy foglalt név'); return; }
    store.write(nn, n === cur ? ed.value : store.read(n)); renderFiles(); toast('Kész: ' + nn);
  });
}
function deleteFile(n) {
  confirmBox('Törlés', n + ' véglegesen törlődik.', 'Törlés').then(function (ok) {
    if (!ok) return;
    store.del(n);
    if (n === cur) { cur = null; curSaved = ''; ed.value = ''; updateHeader(); }
    renderFiles();
  });
}

$('bMore').onclick = function () {

// ------------------------------------------------------------------ boot
(function boot() {
  if (!store.list().length) installSamples(false);
  else if (pref('samplesV') !== '1') { for (var k in SAMPLES) if (store.read(k) == null) store.write(k, SAMPLES[k]); }
  pref('samplesV', '1');
  renderFiles();
  var last = pref('lastOpen');
  if (last && store.read(last) != null) openFile(last);
  else { var s = fileList().filter(isScene)[0]; if (s) openFile(s); }
  updateHeader();
})();
